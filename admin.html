<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Azaan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 p-4 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white p-8 rounded-[2.5rem] shadow-2xl border border-gray-100">
        <h2 class="text-3xl font-black mb-8 text-center text-slate-800 tracking-tight">Settings</h2>
        
        <div class="space-y-6">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Profile Pic Link</label>
                <input id="pic-url" type="text" placeholder="https://..." class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl mt-1 focus:border-sky-500 outline-none transition">
            </div>

            <div class="pt-4 border-t-2 border-slate-50">
                <label class="text-[10px] font-black text-yellow-600 uppercase tracking-widest ml-1">Free Fire Details</label>
                <input id="ff-n" type="text" placeholder="Gaming Name" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl mt-1 mb-2 outline-none">
                <input id="ff-i" type="text" placeholder="Player ID" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none">
            </div>

            <div class="pt-4 border-t-2 border-slate-50">
                <label class="text-[10px] font-black text-orange-600 uppercase tracking-widest ml-1">PUBG Mobile Details</label>
                <input id="pb-n" type="text" placeholder="Gaming Name" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl mt-1 mb-2 outline-none">
                <input id="pb-i" type="text" placeholder="Player ID" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none">
            </div>

            <button onclick="updateData()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold shadow-xl hover:bg-sky-600 transition-all active:scale-95">
                SAVE ALL CHANGES
            </button>
        </div>
        <p class="text-center text-[10px] text-slate-400 mt-6 font-medium">Azaan Khan Official Admin</p>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyC1H9oxa0ZI7vbXDPGxvmHdwT0WrqDC92s", 
            databaseURL: "https://azaan-web-default-rtdb.firebaseio.com", 
            projectId: "azaan-web" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function updateData() {
            db.ref('profile').set({
                picUrl: document.getElementById('pic-url').value,
                ffName: document.getElementById('ff-n').value,
                ffId: document.getElementById('ff-i').value,
                pubgName: document.getElementById('pb-n').value,
                pubgId: document.getElementById('pb-i').value
            }).then(() => {
                alert("Zabardast! Data update ho gaya hai.");
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        }
    </script>
</body>
</html>
