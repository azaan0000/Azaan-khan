<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaan | VIP Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { 
            background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #020617);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .admin-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        input { 
            background: rgba(0, 0, 0, 0.4) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            color: white !important; 
            transition: all 0.3s ease; 
        }
        input:focus { 
            border-color: #38bdf8 !important; 
            outline: none; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            transform: translateY(-1px);
        }
        .btn-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-hover:active { transform: scale(0.95); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-6 pb-20">

    <div class="max-w-xl mx-auto">
        <header class="text-center mb-10 pt-8">
            <div class="inline-block p-3 rounded-2xl bg-sky-500/10 mb-4 animate-bounce">
                <i class="fas fa-shield-alt text-2xl text-sky-500"></i>
            </div>
            <h1 class="text-4xl font-black uppercase italic tracking-tighter text-white">Master Control</h1>
            <p class="text-[10px] text-sky-500/60 uppercase tracking-[0.5em] font-bold mt-2">Azaan Khan Official Hub</p>
        </header>

        <div class="admin-card p-6 rounded-[2.5rem] mb-6 border-t border-sky-500/20">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-5 flex items-center">
                <i class="fas fa-image mr-2 text-sky-500"></i> Identity Image
            </h2>
            <input type="text" id="pic-url" placeholder="Paste direct image link..." class="w-full p-4 rounded-2xl text-sm mb-4">
            <button onclick="updatePic()" class="btn-hover w-full bg-sky-600 hover:bg-sky-500 text-white font-black py-4 rounded-2xl uppercase text-[10px] tracking-[0.2em] shadow-lg shadow-sky-900/20">Update Display Picture</button>
        </div>

        <div class="admin-card p-6 rounded-[2.5rem] mb-6 border-t border-blue-500/20">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-5 flex items-center">
                <i class="fas fa-chart-bar mr-2 text-blue-500"></i> Analytics Dashboard
            </h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-500 ml-3 mb-1 block">FB Likes</label>
                    <input type="text" id="fb-likes" placeholder="e.g. 13k" class="w-full p-4 rounded-2xl text-sm">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-500 ml-3 mb-1 block">FB Followers</label>
                    <input type="text" id="fb-follows" placeholder="e.g. 285" class="text-sm w-full p-4 rounded-2xl">
                </div>
            </div>
            <label class="text-[9px] font-black uppercase text-slate-500 ml-3 mb-1 block">Snapchat Friends</label>
            <input type="text" id="sc-friends" placeholder="e.g. 34 Friends" class="w-full p-4 rounded-2xl text-sm mb-6">
            <button onclick="updateStats()" class="btn-hover w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl uppercase text-[10px] tracking-[0.2em] shadow-lg shadow-blue-900/20">Save Real-time Stats</button>
        </div>

        <div class="admin-card p-6 rounded-[2.5rem] mb-6 border-t border-orange-500/20">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-5 flex items-center">
                <i class="fas fa-gamepad mr-2 text-orange-500"></i> Pro Gaming Config
            </h2>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-500 ml-3 mb-1 block text-orange-500/70">PUBG Mobile ID</label>
                    <input type="text" id="pubg-id" placeholder="Enter ID..." class="w-full p-4 rounded-2xl text-sm">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase text-slate-500 ml-3 mb-1 block text-yellow-500/70">Free Fire ID</label>
                    <input type="text" id="ff-id" placeholder="Enter ID..." class="w-full p-4 rounded-2xl text-sm">
                </div>
            </div>
            <button onclick="updateGaming()" class="btn-hover w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-4 rounded-2xl uppercase text-[10px] tracking-[0.2em] shadow-lg shadow-orange-900/20">Sync Gaming IDs</button>
        </div>

        <div class="admin-card p-4 rounded-[2rem] border-t border-red-500/20 text-center">
            <button onclick="resetData()" class="text-[9px] font-black uppercase tracking-[0.3em] text-red-500/50 hover:text-red-500 transition-colors">
                <i class="fas fa-undo-alt mr-2"></i> Reset All Data (Excluding Photo)
            </button>
        </div>

        <p class="text-center text-[8px] text-slate-600 uppercase tracking-[0.5em] font-bold mt-10">
            Encrypted Connection <i class="fas fa-lock ml-1 text-sky-800"></i>
        </p>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = { 
            apiKey: "AIzaSyC1H9oxa0ZI7vbXDPGxvmHdwT0WrqDC92s", 
            databaseURL: "https://azaan-web-default-rtdb.firebaseio.com", 
            projectId: "azaan-web" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load Data and keep fields synced
        db.ref().on('value', (snap) => {
            const data = snap.val();
            if(!data) return;
            if(data.social_stats) {
                document.getElementById('fb-likes').value = data.social_stats.fbLikes || '';
                document.getElementById('fb-follows').value = data.social_stats.fbFollows || '';
                document.getElementById('sc-friends').value = data.social_stats.scFriends || '';
            }
            if(data.profile) {
                document.getElementById('pic-url').value = data.profile.picUrl || '';
            }
            if(data.gaming_ids) {
                document.getElementById('pubg-id').value = data.gaming_ids.pubg || '';
                document.getElementById('ff-id').value = data.gaming_ids.ff || '';
            }
        });

        function updatePic() {
            const url = document.getElementById('pic-url').value;
            db.ref('profile').update({ picUrl: url }).then(() => alert("✅ DP Updated!"));
        }

        function updateStats() {
            db.ref('social_stats').update({
                fbLikes: document.getElementById('fb-likes').value,
                fbFollows: document.getElementById('fb-follows').value,
                scFriends: document.getElementById('sc-friends').value
            }).then(() => alert("✅ Stats Synchronized!"));
        }

        function updateGaming() {
            db.ref('gaming_ids').update({
                pubg: document.getElementById('pubg-id').value,
                ff: document.getElementById('ff-id').value
            }).then(() => alert("✅ Gaming IDs Updated!"));
        }

        // UPDATED RESET SYSTEM: Doesn't force a specific image
        function resetData() {
            if(confirm("⚠️ ARE YOU SURE? This will clear all statistics and IDs! Photo will stay the same.")) {
                const currentPic = document.getElementById('pic-url').value;
                db.ref('/').set({
                    profile: { picUrl: currentPic || "https://i.ibb.co/yB6SprbZ/1000066584.png" },
                    social_stats: { fbLikes: "0", fbFollows: "0", scFriends: "0" },
                    gaming_ids: { pubg: "---", ff: "---" }
                }).then(() => alert("♻️ Stats Reset. Photo preserved!"));
            }
        }
    </script>
</body>
</html>
