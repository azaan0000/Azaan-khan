<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaan | VIP Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #020617; font-family: sans-serif; }
        .admin-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; transition: 0.3s; }
        input:focus { border-color: #0ea5e9 !important; outline: none; box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-6">

    <div class="max-w-xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-black uppercase italic tracking-tighter text-sky-500">Master Control</h1>
            <p class="text-[10px] text-slate-500 uppercase tracking-[0.4em] font-bold">Azaan Khan Official Hub</p>
        </header>

        <div class="admin-card p-6 rounded-[2rem] mb-6">
            <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center">
                <i class="fas fa-user-circle mr-2 text-sky-500"></i> Profile Image
            </h2>
            <input type="text" id="pic-url" placeholder="Paste direct image link here..." class="w-full p-4 rounded-2xl text-sm">
            <button onclick="updatePic()" class="w-full mt-4 bg-sky-600 hover:bg-sky-500 text-white font-black py-3 rounded-xl uppercase text-[10px] tracking-widest transition">Update DP</button>
        </div>

        <div class="admin-card p-6 rounded-[2rem] mb-6">
            <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center">
                <i class="fas fa-chart-line mr-2 text-sky-500"></i> Social Stats
            </h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="text-[9px] font-bold uppercase text-slate-500 ml-2">FB Likes</label>
                    <input type="text" id="fb-likes" placeholder="e.g. 10K" class="w-full p-4 rounded-2xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-[9px] font-bold uppercase text-slate-500 ml-2">FB Followers</label>
                    <input type="text" id="fb-follows" placeholder="e.g. 15K" class="w-full p-4 rounded-2xl text-sm mt-1">
                </div>
            </div>
            <label class="text-[9px] font-bold uppercase text-slate-500 ml-2">Snapchat Friends</label>
            <input type="text" id="sc-friends" placeholder="e.g. 500+" class="w-full p-4 rounded-2xl text-sm mt-1">
            <button onclick="updateStats()" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl uppercase text-[10px] tracking-widest transition shadow-lg shadow-blue-900/20">Save Social Stats</button>
        </div>

        <div class="admin-card p-6 rounded-[2rem] mb-10">
            <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center">
                <i class="fas fa-gamepad mr-2 text-sky-500"></i> Gaming IDs
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[9px] font-bold uppercase text-slate-500 ml-2">PUBG Mobile ID</label>
                    <input type="text" id="pubg-id" placeholder="Enter ID..." class="w-full p-4 rounded-2xl text-sm mt-1">
                </div>
                <div>
                    <label class="text-[9px] font-bold uppercase text-slate-500 ml-2">Free Fire ID</label>
                    <input type="text" id="ff-id" placeholder="Enter ID..." class="w-full p-4 rounded-2xl text-sm mt-1">
                </div>
            </div>
            <button onclick="updateGaming()" class="w-full mt-6 bg-orange-600 hover:bg-orange-500 text-white font-black py-4 rounded-xl uppercase text-[10px] tracking-widest transition shadow-lg shadow-orange-900/20">Update IDs</button>
        </div>

        <p class="text-center text-[8px] text-slate-700 uppercase tracking-[0.5em] font-bold">Secured Admin Access</p>
    </div>

    <script>
        // Firebase Config (Matches your main site)
        const firebaseConfig = { 
            apiKey: "AIzaSyC1H9oxa0ZI7vbXDPGxvmHdwT0WrqDC92s", 
            databaseURL: "https://azaan-web-default-rtdb.firebaseio.com", 
            projectId: "azaan-web" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Update Profile Pic
        function updatePic() {
            const url = document.getElementById('pic-url').value;
            if(!url) return alert("Please enter a link!");
            db.ref('profile').update({ picUrl: url })
              .then(() => alert("Profile Picture Updated!"));
        }

        // 2. Update Social Stats
        function updateStats() {
            db.ref('social_stats').update({
                fbLikes: document.getElementById('fb-likes').value,
                fbFollows: document.getElementById('fb-follows').value,
                scFriends: document.getElementById('sc-friends').value
            }).then(() => alert("Social Stats Updated Live!"));
        }

        // 3. Update Gaming IDs
        function updateGaming() {
            db.ref('gaming_ids').update({
                pubg: document.getElementById('pubg-id').value,
                ff: document.getElementById('ff-id').value
            }).then(() => alert("Gaming IDs Updated Live!"));
        }

        // Load current data into inputs
        db.ref().on('value', (snap) => {
            const data = snap.val();
            if(data.social_stats) {
                document.getElementById('fb-likes').value = data.social_stats.fbLikes || '';
                document.getElementById('fb-follows').value = data.social_stats.fbFollows || '';
                document.getElementById('sc-friends').value = data.social_stats.scFriends || '';
            }
            if(data.profile) document.getElementById('pic-url').value = data.profile.picUrl || '';
            if(data.gaming_ids) {
                document.getElementById('pubg-id').value = data.gaming_ids.pubg || '';
                document.getElementById('ff-id').value = data.gaming_ids.ff || '';
            }
        });
    </script>
</body>
</html>
