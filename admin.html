<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azaan Khan | Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #020617; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .preview-img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 3px solid #0ea5e9; margin: 0 auto; cursor: pointer; transition: 0.3s; }
        .preview-img:hover { filter: brightness(1.2); transform: scale(1.05); }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-6">

    <div id="login-section" class="max-w-md w-full glass p-8 rounded-[2.5rem] shadow-2xl text-center">
        <h2 class="text-2xl font-black uppercase italic mb-6">Admin Login</h2>
        <input type="password" id="admin-pass" placeholder="Enter Password" class="w-full bg-black/40 p-4 rounded-2xl border border-white/10 mb-4 outline-none focus:border-sky-500 text-center">
        <button onclick="checkPass()" class="w-full bg-sky-600 py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-sky-500 transition">Login</button>
    </div>

    <div id="admin-panel" class="max-w-md w-full glass p-8 rounded-[2.5rem] shadow-2xl hidden text-center">
        <h1 class="text-2xl font-black italic uppercase text-sky-500 mb-6">Control Panel</h1>

        <div class="mb-8 group">
            <p class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-3">Tap Circle to Select New Photo</p>
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="processImage(this)">
            <div class="relative inline-block">
                <img id="imgPreview" src="https://via.placeholder.com/150" class="preview-img" onclick="document.getElementById('fileInput').click()">
                <div class="absolute inset-0 rounded-full bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition pointer-events-none">
                    <i class="fas fa-camera text-2xl"></i>
                </div>
            </div>
            <input type="hidden" id="picUrlStore">
        </div>

        <div class="space-y-5 text-left">
            <div>
                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">YouTube Video ID</label>
                <input type="text" id="latestYT" placeholder="Example: UGWXAN8p73w" class="w-full bg-black/30 border border-white/10 p-4 rounded-2xl text-sm mt-1 outline-none focus:border-red-500">
            </div>

            <div>
                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400 ml-2">Facebook Text</label>
                <textarea id="fbUpdateText" rows="2" class="w-full bg-black/30 border border-white/10 p-4 rounded-2xl text-sm mt-1 outline-none focus:border-blue-500 resize-none"></textarea>
            </div>

            <button onclick="updateData()" id="updateBtn" class="w-full bg-sky-600 py-4 rounded-2xl font-black uppercase text-xs tracking-[0.2em] shadow-lg shadow-sky-600/30 transition active:scale-95">Save Everything</button>
            <div id="status" class="text-[10px] font-bold uppercase tracking-widest hidden mt-4"></div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = { 
            apiKey: "AIzaSyC1H9oxa0ZI7vbXDPGxvmHdwT0WrqDC92s", 
            databaseURL: "https://azaan-web-default-rtdb.firebaseio.com", 
            projectId: "azaan-web" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function checkPass() {
            if(document.getElementById('admin-pass').value === "azaan786") {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadCurrentData();
            }
        }

        function processImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300; // Database loading issue fix karne ke liye
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6); // Quality 60% taake smooth chale
                        document.getElementById('imgPreview').src = compressedBase64;
                        document.getElementById('picUrlStore').value = compressedBase64;
                    };
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function loadCurrentData() {
            db.ref('profile').on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    if(data.picUrl) {
                        document.getElementById('imgPreview').src = data.picUrl;
                        document.getElementById('picUrlStore').value = data.picUrl;
                    }
                    if(data.latestYT) document.getElementById('latestYT').value = data.latestYT;
                    if(data.fbUpdateText) document.getElementById('fbUpdateText').value = data.fbUpdateText;
                }
            });
        }

        function updateData() {
            const btn = document.getElementById('updateBtn');
            const status = document.getElementById('status');
            const newData = {
                picUrl: document.getElementById('picUrlStore').value,
                latestYT: document.getElementById('latestYT').value,
                fbUpdateText: document.getElementById('fbUpdateText').value
            };

            btn.innerText = "SAVING...";
            btn.disabled = true;

            db.ref('profile').update(newData).then(() => {
                btn.innerText = "SAVE EVERYTHING";
                btn.disabled = false;
                status.innerText = "UPDATED SUCCESSFULLY!";
                status.className = "text-center text-[10px] font-bold uppercase text-green-500 mt-4";
                status.classList.remove('hidden');
                setTimeout(() => status.classList.add('hidden'), 3000);
            });
        }
    </script>
</body>
</html>
