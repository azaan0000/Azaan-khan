name: Update YouTube stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch YouTube data
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync } from "node:fs";
          const KEY = process.env.YT_API_KEY;
          const CHANNEL_ID = "UCQqGwkjnmZ6b5iKprYXmmsg";
          const UPLOADS = "UU" + CHANNEL_ID.slice(2);
          if (!KEY) { console.error("YT_API_KEY secret is missing"); process.exit(1); }
          const get = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(r.status + " " + await r.text()); return r.json(); };
          const base = "https://www.googleapis.com/youtube/v3";
          const ch = await get(`${base}/channels?part=statistics&id=${CHANNEL_ID}&key=${KEY}`);
          const pl = await get(`${base}/playlistItems?part=contentDetails&playlistId=${UPLOADS}&maxResults=7&key=${KEY}`);
          const ids = (pl.items || []).map(i => i.contentDetails.videoId).join(",");
          let videos = [];
          if (ids) {
            const v = await get(`${base}/videos?part=snippet,statistics&id=${ids}&key=${KEY}`);
            const byId = Object.fromEntries((v.items || []).map(x => [x.id, x]));
            videos = ids.split(",").map(id => byId[id]).filter(Boolean).map(x => ({
              id: x.id,
              title: x.snippet.title,
              thumb: (x.snippet.thumbnails.high || x.snippet.thumbnails.medium || x.snippet.thumbnails.default).url,
              views: Number(x.statistics.viewCount ?? 0),
              published: x.snippet.publishedAt
            }));
          }
          const s = ch.items?.[0]?.statistics ?? {};
          const out = {
            subscriberCount: s.subscriberCount ?? null,
            viewCount: s.viewCount ?? null,
            videoCount: s.videoCount ?? null,
            videos,
            updated: new Date().toISOString()
          };
          writeFileSync("youtube.json", JSON.stringify(out, null, 1) + "\n");
          console.log("ok", out.subscriberCount, videos.length);
          EOF
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add youtube.json
          git diff --staged --quiet || (git commit -m "Update YouTube stats" && git push)
